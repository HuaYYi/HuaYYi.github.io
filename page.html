<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuaYYi Blog</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- 动态页面查看器：本地模式新建的页面没有静态 HTML 文件，
       导航跳 page.html?slug=<页面id>，由 apps.js 按 pages.json
       的页面配置渲染 屏 → 盒子 → 板块。
       引入全部模板样式，三种模板（landing/list/content）都能渲染 -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/archives.css">
  <link rel="stylesheet" href="assets/css/post.css">
</head>
<body>
  <header id="site-header"></header>

  <!-- 页面主体：apps.js 按 ?slug= 对应页面的 screens 配置填充 -->
  <main id="app-screens"></main>

  <footer id="site-footer"></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/apps.js"></script>
  <script src="assets/js/screen-scroll.js"></script>
  <script src="assets/js/context-menu.js"></script>
</body>
</html>
