<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9fe"/>
      <stop offset="0.55" stop-color="#e6effb"/>
      <stop offset="1" stop-color="#fbf0dd"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7d9a0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f7d9a0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f7d9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 朝阳与光晕 -->
  <circle cx="1430" cy="700" r="300" fill="url(#sunGlow)"/>
  <circle cx="1430" cy="700" r="96" fill="#f4d7a0" opacity="0.85"/>

  <!-- 薄云 -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="360" cy="300" rx="220" ry="26"/>
    <ellipse cx="520" cy="350" rx="300" ry="20" opacity="0.7"/>
    <ellipse cx="1180" cy="240" rx="260" ry="22" opacity="0.6"/>
    <ellipse cx="1700" cy="420" rx="200" ry="18" opacity="0.5"/>
  </g>

  <!-- 最远山层 -->
  <path d="M0 820 L160 740 L330 800 L520 700 L720 790 L900 720 L1120 800 L1320 710 L1520 790 L1720 730 L1920 800 L1920 1080 L0 1080 Z"
        fill="#d4dfed"/>
  <!-- 中山层 -->
  <path d="M0 900 L200 820 L420 880 L640 790 L880 870 L1100 810 L1360 890 L1600 820 L1920 880 L1920 1080 L0 1080 Z"
        fill="#b6c6db"/>
  <!-- 近山层 -->
  <path d="M0 980 L260 900 L520 960 L820 880 L1120 960 L1420 900 L1700 970 L1920 920 L1920 1080 L0 1080 Z"
        fill="#8fa4bf"/>
</svg>
