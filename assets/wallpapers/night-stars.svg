<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.6" stop-color="#121b33"/>
      <stop offset="1" stop-color="#1b2846"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbe6ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#dbe6ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#dbe6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- 噪点阈值化 = 满天细碎星点 -->
    <filter id="starField" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 14 -7.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>
  <rect width="1920" height="860" filter="url(#starField)" opacity="0.8"/>

  <!-- 月亮与光晕 -->
  <circle cx="1480" cy="250" r="230" fill="url(#moonGlow)"/>
  <circle cx="1480" cy="250" r="82" fill="#e3eaff"/>
  <circle cx="1452" cy="228" r="12" fill="#cdd8f2" opacity="0.7"/>
  <circle cx="1506" cy="276" r="18" fill="#cdd8f2" opacity="0.55"/>
  <circle cx="1496" cy="214" r="8" fill="#cdd8f2" opacity="0.6"/>

  <!-- 亮星 + 十字光芒 -->
  <g fill="#f4f7ff">
    <g opacity="0.95"><circle cx="320" cy="180" r="2.6"/><path d="M320 168 V192 M308 180 H332" stroke="#f4f7ff" stroke-width="1.2" opacity="0.7"/></g>
    <g opacity="0.85"><circle cx="760" cy="120" r="2.2"/><path d="M760 110 V130 M750 120 H770" stroke="#f4f7ff" stroke-width="1" opacity="0.6"/></g>
    <g opacity="0.9"><circle cx="1080" cy="300" r="2.8"/><path d="M1080 287 V313 M1067 300 H1093" stroke="#f4f7ff" stroke-width="1.2" opacity="0.7"/></g>
    <g opacity="0.8"><circle cx="190" cy="420" r="2"/><path d="M190 411 V429 M181 420 H199" stroke="#f4f7ff" stroke-width="1" opacity="0.55"/></g>
    <g opacity="0.85"><circle cx="600" cy="380" r="2.2"/></g>
    <g opacity="0.7"><circle cx="1260" cy="150" r="1.8"/></g>
    <g opacity="0.8"><circle cx="920" cy="220" r="2"/></g>
    <g opacity="0.75"><circle cx="450" cy="520" r="1.8"/></g>
    <g opacity="0.7"><circle cx="1720" cy="520" r="2"/></g>
  </g>

  <!-- 远山 -->
  <path d="M0 820 L180 750 L380 810 L600 720 L840 800 L1080 730 L1320 810 L1560 740 L1920 800 L1920 1080 L0 1080 Z"
        fill="#101a30"/>
  <!-- 近山 -->
  <path d="M0 930 L260 850 L540 930 L840 850 L1160 940 L1480 860 L1760 940 L1920 890 L1920 1080 L0 1080 Z"
        fill="#0a1120"/>
</svg>
